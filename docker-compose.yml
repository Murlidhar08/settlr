services:
  settlr:
    image: chavda2772/settlr:latest
    container_name: settlr
    environment:
      # Application
      NEXT_PUBLIC_APP_NAME: "Settlr"
      NEXT_PUBLIC_APP_DESCRIPTION: "Settlr for managing personal finance"
      ADVANCE_PASS_CHECK: "true"

      # Better Auth
      BETTER_AUTH_SECRET: "lMD1eol2MrTxIZixGYyjwT0G0DQJ6oLJ"
      BETTER_AUTH_URL: "http://localhost:3000"
      BETTER_AUTH_TRUSTED_ORIGINS: "https://example.com,https://*.example.com"

      # DATABASE
      DATABASE_URL: "postgresql://settlr_admin:Settlr@123@postgres_db:5432/settlr?schema=public"

    ports:
      - "3000:3000"
    restart: always
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


volumes:
  uploads:
